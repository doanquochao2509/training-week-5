spring.application.name=myshop
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MyShop;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true

spring.datasource.username=sa
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
jwt.secret=MySecretKeyMySecretKeyMySecretKeyMySecretKey
jwt.expiration=86400000

app.upload.dir=uploads/products
app.base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB